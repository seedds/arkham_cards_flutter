name: Build

# Manual and tag-triggered only. Each run moves several GB -- the card art down
# from a release, then a 1.2 GB binary back up -- so building on every push
# would be slow for no one's benefit.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

env:
  # Must match the version this project is developed against. Flutter's engine
  # decides how the WebP art decodes, so a runner on a different one is not
  # testing the app that ships.
  FLUTTER_VERSION: 3.44.8
  # The release tag tools/publish_assets.sh writes to.
  IMAGES_TAG: card-images-v1
  EXPECTED_IMAGES: 7742

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          # android/app/build.gradle.kts compiles against 17.
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Fetch the card art
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/fetch-images.sh

      - run: flutter pub get
      - run: flutter analyze

      # Includes card_images_test.dart, which checks every filename in
      # cards.json resolves and every file is really a WebP. That is the
      # integrity check on the tarball transfer, not just a unit test.
      - run: flutter test

      - run: flutter build apk --release

      - name: Disk and size
        run: |
          ls -lh build/app/outputs/flutter-apk/app-release.apk
          df -h /

      - uses: actions/upload-artifact@v7
        with:
          name: arkham-cards-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          # The payload is 1.2 GB of already-compressed WebP. Zipping it again
          # costs minutes and saves about a percent.
          compression-level: 0

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Fetch the card art
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/fetch-images.sh

      - run: flutter pub get
      - run: flutter build ios --release --no-codesign

      # `flutter build ipa` cannot produce an unsigned IPA -- its export step
      # needs a signing identity, and --no-codesign only reaches the .app. An
      # IPA is just a zip with the bundle under Payload/, so it is built here
      # by hand. Install it by re-signing with Sideloadly or AltStore.
      #
      # Disk is the constraint: the runner has 14 GB, and a release build
      # leaves two distinct 1.2 GB copies of Runner.app plus 1.3 GB of dSYMs.
      # So the intermediates go before the zip, and the bundle is moved rather
      # than copied into Payload/.
      - name: Package an unsigned IPA
        run: |
          mkdir -p Payload
          mv build/ios/iphoneos/Runner.app Payload/
          rm -rf build/ios/Release-iphoneos
          zip -qry Runner.ipa Payload
          rm -rf Payload
          ls -lh Runner.ipa
          df -h /

      - uses: actions/upload-artifact@v7
        with:
          name: arkham-cards-ipa
          path: Runner.ipa
          compression-level: 0
